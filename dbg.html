<!doctype html><meta charset=utf-8><pre id=o></pre><script>
const FB='https://taht-savasi-default-rtdb.europe-west1.firebasedatabase.app';const o=document.getElementById('o');const L=t=>o.textContent+=t+'\n';
const K=new URLSearchParams(location.search).get('k');
(async()=>{const t=async(n,m,p,b)=>{try{const r=await fetch(FB+p,{method:m,headers:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});L(n+' '+r.status+' '+(await r.text()).slice(0,150))}catch(e){L(n+' ERR '+e)}};
await t('owner-read','GET','/owner.json');
await t('rooms-shallow','GET','/rooms.json?shallow=true');
await t('owner-put','PUT','/owner.json',K);
const c='dbg'+Date.now();
await t('key-only','PATCH','/.json',{['keys/'+c]:K});
await t('info-only','PUT','/rooms/'+c+'/info.json',{status:'lobby',host:'x',t:1});
const c2='dbh'+Date.now();
await t('multi','PATCH','/.json',{['keys/'+c2]:K,['rooms/'+c2]:{info:{status:'lobby',host:'x',t:1},p:{x:{name:'a',ts:1}}}});
await t('old-style','PUT','/rooms/zz'+Date.now()+'.json',{info:{status:'lobby'}});
})();
</script>
