<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taht Savaşı">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Taht Savaşı</title>
<style>
:root{--gold:#D9B45A;--gold2:#F3DC8C;--goldD:#8a6a2c;--red:#C2392F;--ink:#F1E6CC;--mut:#A0927A;--bg:#0C0907;--pan:#1E1712;--pan2:#2A2018;--line:#4d3b26;--serif:'Palatino Linotype','Book Antiqua',Palatino,'Iowan Old Style',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(ellipse 120% 70% at 50% -5%,#4a2c15 0%,#21150d 45%,#0b0806 100%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100dvh;max-width:820px;margin:0 auto;position:relative;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
.hidden{display:none!important}
#ember{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#ember i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#FFA44A;box-shadow:0 0 8px 2px rgba(255,140,40,.7);opacity:0;animation:emb linear infinite}
@keyframes emb{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}100%{transform:translate(var(--dx),-95vh) scale(.3);opacity:0}}
#vign{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.55) 100%)}
#game,#setup{position:relative;z-index:1}
#game{width:100%;min-width:0;overflow:hidden}
#game>*{min-width:0}
.ic{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.card{--cw:88px;width:var(--cw);height:calc(var(--cw)*1.42);font-size:calc(var(--cw)/6.6);border-radius:.62em;position:relative;flex:none;overflow:hidden;color:var(--ink);
background:radial-gradient(ellipse 90% 60% at 50% 40%,color-mix(in srgb,var(--ac) 34%,#3b2a1b) 0%,#251a11 60%,#140e09 100%);
border:.13em solid #2a1c0e;box-shadow:0 0 0 .1em var(--goldD),0 .45em 1em rgba(0,0,0,.7)}
.card .fr{position:absolute;inset:.22em;border-radius:.45em;border:.1em solid var(--gold);box-shadow:inset 0 0 0 .14em #1a1009,inset 0 0 0 .2em color-mix(in srgb,var(--ac) 75%,#000),inset 0 0 1.4em rgba(0,0,0,.65);pointer-events:none}
.card .fr:before,.card .fr:after{content:'';position:absolute;width:.9em;height:.9em;border:.12em solid var(--gold2);transform:rotate(45deg);background:#1a1009;left:50%;margin-left:-.45em}
.card .fr:before{top:-.5em}.card .fr:after{bottom:-.5em}
.card:after{content:'';position:absolute;inset:0;background:linear-gradient(118deg,transparent 30%,rgba(255,236,190,.16) 46%,transparent 58%);pointer-events:none;opacity:.8}
.card .pt{position:absolute;left:.38em;top:.36em;width:2.05em;height:2.45em;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);background:linear-gradient(180deg,#fbe9a8,#c9982f 60%,#8f6a1f);color:#2a1806;font-weight:800;font-size:1.18em;display:flex;align-items:center;justify-content:center;padding-bottom:.35em;z-index:3;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.card .gem{position:absolute;right:.6em;top:.6em;width:.95em;height:.95em;transform:rotate(45deg);background:radial-gradient(circle at 35% 35%,#fff8,var(--ac) 45%,color-mix(in srgb,var(--ac) 50%,#000));border:.08em solid var(--gold2);z-index:3;box-shadow:0 0 .5em var(--ac)}
.card .art{position:absolute;left:50%;top:44%;width:5.1em;height:5.1em;margin:-2.55em 0 0 -2.55em;border-radius:50%;
background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ac) 55%,#000) 0%,color-mix(in srgb,var(--ac) 18%,#0b0705) 62%,#0b0705 100%);
border:.12em solid var(--gold);box-shadow:0 0 0 .1em #1a1009,0 0 0 .2em color-mix(in srgb,var(--gold) 50%,transparent),0 0 1.4em color-mix(in srgb,var(--ac) 60%,transparent),inset 0 0 1em rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:.85em;color:#F6DE97}
.card .art .ic{filter:drop-shadow(0 0 .25em color-mix(in srgb,var(--ac) 90%,#fff)) drop-shadow(0 .08em .06em #000)}
.card .nm{position:absolute;left:.5em;right:.5em;bottom:.62em;text-align:center;font-weight:800;font-size:1em;letter-spacing:.02em;padding:.28em .1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
background:linear-gradient(180deg,#5a3f1d,#2b1d0e);border-top:.07em solid var(--gold2);border-bottom:.07em solid var(--goldD);color:#F6E6B6;z-index:3;text-shadow:0 1px 2px #000}
.card.xs .nm,.card.xs .gem,.card.xs .fr:before,.card.xs .fr:after{display:none}
.card.xs .art{top:52%}
.card.blk{filter:grayscale(.95) brightness(.6)}
.card.blk .art:after{content:'';position:absolute;inset:-.2em;border-radius:50%;background:repeating-linear-gradient(45deg,transparent 0 .35em,rgba(0,0,0,.6) .35em .55em)}
.card.dis{filter:saturate(.35) brightness(.62)}
.back{--cw:88px;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.075);flex:none;position:relative;overflow:hidden;
background:radial-gradient(ellipse at 50% 45%,#7a1d18 0%,#43100c 62%,#260806 100%);border:1px solid #2a0f08;box-shadow:0 0 0 1.5px var(--goldD),0 4px 10px rgba(0,0,0,.6)}
.back:before{content:'';position:absolute;inset:7%;border:1px solid #d9b45a88;border-radius:calc(var(--cw)*.05);background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(0,0,0,.14) 5px 10px)}
.back svg{position:absolute;left:50%;top:50%;width:56%;height:56%;transform:translate(-50%,-50%);color:var(--gold)}
.hid{visibility:hidden}
#setup{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;gap:14px;text-align:center;overflow:auto;background:radial-gradient(ellipse at 50% 28%,#55311a,#0c0907 70%)}
#setup>:first-child{margin-top:auto}#setup>:last-child{margin-bottom:auto}
#setup .crest{width:118px;height:118px;filter:drop-shadow(0 0 22px rgba(255,160,60,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#setup h1{font-size:clamp(38px,10vw,62px);font-weight:800;letter-spacing:.16em;line-height:1;background:linear-gradient(180deg,#fff2c2,#d9b45a 55%,#8f6a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a230c) drop-shadow(0 0 18px rgba(255,150,40,.35))}
#setup .tag{color:#cdbb95;font-style:italic;font-size:15px;letter-spacing:.06em;margin-top:-4px}
.fan{display:flex;justify-content:center;margin:8px 0 18px;height:118px;align-items:flex-end}
.fan>div{margin:0 -12px;transform-origin:50% 130%}
.lab{font-size:11px;letter-spacing:.32em;font-weight:800;color:var(--gold);margin-top:6px}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{min-width:50px;padding:11px 15px;border-radius:12px;border:1.5px solid var(--line);background:rgba(30,23,18,.85);font-weight:700;font-size:16px;color:#d8c9a8;transition:all .2s}
.seg button.on{border-color:var(--gold);background:linear-gradient(180deg,#4a3518,#2b1d0e);color:var(--gold2);box-shadow:0 0 14px rgba(217,180,90,.25)}
.btn{padding:14px 26px;border-radius:12px;font-weight:800;font-size:17px;border:1.5px solid var(--line);background:var(--pan2);letter-spacing:.04em;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#f6dd8e,#c9982f 55%,#9c7424);color:#2a1806;border:1px solid #fff0b3;box-shadow:0 0 0 2px #5a3e14,0 8px 24px rgba(217,160,60,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.big{min-width:230px;font-size:20px;letter-spacing:.2em;padding:16px 30px}
.btn:disabled{opacity:.4}
.btn.ghost{background:none;border-color:transparent;color:#cdbb95;font-size:15px}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;flex:none}
header .logo{width:26px;height:26px;color:var(--gold)}
header .t{font-size:12px;letter-spacing:.32em;font-weight:800;color:var(--gold);flex:1;white-space:nowrap}
header .t small{display:inline-block;margin-left:8px;letter-spacing:.18em;color:#fff;background:var(--red);padding:2px 7px;border-radius:6px;font-size:9.5px;vertical-align:2px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
.ib{width:36px;height:36px;border-radius:50%;background:rgba(30,23,18,.85);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#cdbb95}
.ib svg{width:18px;height:18px}
.ib.on{border-color:var(--gold);color:var(--gold2)}
#opps{display:flex;gap:4px;padding:6px 8px 2px;flex:none;justify-content:space-around}
.opp{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;transition:opacity .25s,transform .25s;padding-top:4px}
.avw{position:relative;width:58px;height:64px;display:flex;align-items:center;justify-content:center}
.avw .sh{width:50px;height:58px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
.avw .ring{position:absolute;inset:-6px -4px -2px;border-radius:50%;z-index:1;opacity:0;transition:opacity .3s;background:conic-gradient(from 0deg,transparent,#ffd877,transparent 40%,transparent 50%,#ffd877,transparent 90%);animation:spin 2.2s linear infinite;filter:blur(2px)}
@keyframes spin{to{transform:rotate(360deg)}}
.turn .avw .ring,#me.turn .ring{opacity:1}
.opp.turn{transform:translateY(2px) scale(1.06)}
.avw .crown{position:absolute;top:-11px;left:50%;width:24px;height:18px;margin-left:-12px;z-index:3;color:#ffd877;filter:drop-shadow(0 0 6px rgba(255,200,80,.8))}
.avw .st{position:absolute;bottom:-2px;right:-6px;z-index:4;display:flex;gap:2px}
.avw .st i{width:20px;height:20px;border-radius:50%;background:#16100b;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.avw .st i svg{width:12px;height:12px}
.avw .st i.r{border-color:var(--red);color:#ff8a7a}
.onm{font-size:13.5px;font-weight:800;margin-top:3px;letter-spacing:.03em;color:#ead9b2;white-space:nowrap}
.turn .onm{color:var(--gold2);text-shadow:0 0 10px rgba(255,200,80,.6)}
.ost{display:flex;align-items:center;gap:7px;margin-top:1px;font-weight:800}
.ost .sc{font-size:19px;color:var(--gold2);line-height:1}
.ost .hc{display:flex;align-items:center;gap:3px;font-size:12.5px;color:#cdbb95}
.ost .hc .back{--cw:11px;border-radius:2px;box-shadow:0 0 0 1px var(--goldD)}
.ost .hc .back:before,.ost .hc .back svg{display:none}
.think{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:5;background:#16100b;border:1px solid var(--gold);border-radius:10px;padding:1px 7px;font-size:13px;letter-spacing:2px;color:var(--gold2);opacity:0;transition:opacity .2s}
.thinking .think{opacity:1}
.think b{display:inline-block;animation:dot 1s infinite}.think b:nth-child(2){animation-delay:.15s}.think b:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-3px);opacity:1}}
.opp.tgt .avw .sh{animation:tgt 0.9s ease-in-out infinite}
@keyframes tgt{0%,100%{filter:drop-shadow(0 0 3px #ffd877) drop-shadow(0 4px 6px #000)}50%{filter:drop-shadow(0 0 14px #ffd877) drop-shadow(0 0 4px #fff)}}
.opp.tgt:after{content:'HEDEF';position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8.5px;letter-spacing:.2em;font-weight:800;background:var(--gold);color:#2a1806;padding:1px 6px;border-radius:5px;z-index:6}
.opp.no{opacity:.35}
.opp.hurt .avw{animation:hurt .5s}
@keyframes hurt{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#table{flex:1 1 auto;min-height:150px;max-height:300px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;margin:6px 10px 4px;border-radius:26px;position:relative;
background:radial-gradient(ellipse 80% 70% at 50% 50%,#3d2715 0%,#2a1a0d 55%,#170e07 100%);border:1.5px solid #6b4a22;box-shadow:inset 0 0 0 4px #1a1009,inset 0 0 0 5px #6b4a2266,inset 0 0 60px rgba(0,0,0,.7),0 10px 24px rgba(0,0,0,.5)}
#table:before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px);pointer-events:none}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none}
.pile .pc2{position:relative;width:62px;height:88px}
.pile .pc2>*{position:absolute;left:0;top:0}
.pile .cnt{font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--mut);text-align:center;line-height:1.3}
.pile .cnt b{display:block;color:var(--gold2);font-size:16px;letter-spacing:.02em}
.pile .empty{width:62px;height:88px;border:1.5px dashed rgba(217,180,90,.25);border-radius:7px}
#deck.low .pc2{animation:low 1.2s ease-in-out infinite}
@keyframes low{50%{filter:drop-shadow(0 0 10px #ff5a3c)}}
#deck.low .cnt b{color:#ff8a7a}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;height:100%}
#stageCard{--sw:clamp(90px,29vw,140px);width:var(--sw);height:calc(var(--sw)*1.42);border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(217,180,90,.18)}
#stageCard.on{border-color:transparent}
#stageCard .card{animation:stg .3s ease}
@keyframes stg{from{transform:scale(.9)}to{transform:none}}
#stageCard .glow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac,#d9b45a) 45%,transparent),transparent 65%);z-index:-1}
#cap{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--mut);min-height:15px;text-align:center;white-space:nowrap}
#cap b{color:var(--gold2)}
#narr{flex:none;margin:0 auto;min-height:38px;width:92%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16.5px;font-weight:800;line-height:1.25;padding:6px 26px;position:relative;color:#f3e6c8;letter-spacing:.01em}
#narr:before,#narr:after{content:'';position:absolute;top:50%;width:14px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
#narr:before{left:4px}#narr:after{right:4px;transform:scaleX(-1)}
#narr.pop{animation:narr .3s ease}
@keyframes narr{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#narr small{display:block;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em;margin-top:2px}
#me{flex:none;display:flex;align-items:center;gap:10px;margin:2px 10px 0;padding:6px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(42,32,24,.9),rgba(26,19,14,.9));border:1.5px solid var(--line);position:relative;min-height:74px;transition:border-color .3s,box-shadow .3s}
#me.turn{border-color:var(--gold);box-shadow:0 0 0 1px #ffd87755,0 0 22px rgba(255,200,80,.25)}
#me .avw{width:46px;height:52px;flex:none}
#me .avw .sh{width:40px;height:46px}
#me .sc{display:flex;flex-direction:column;align-items:center;min-width:44px;flex:none}
#me .sc b{font-size:28px;line-height:1;color:var(--gold2);text-shadow:0 0 12px rgba(255,200,80,.35)}
#me .sc small{font-size:9.5px;letter-spacing:.14em;color:var(--mut);font-weight:800;margin-top:2px;white-space:nowrap}
#me .sc.pulse b{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.5);color:#fff}}
#mySaray{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;align-items:center;scrollbar-width:none;padding:2px 0;height:62px}
#mySaray::-webkit-scrollbar{display:none}
#mySaray .card{--cw:42px}
#mySaray .empty{color:var(--mut);font-size:12px;font-style:italic;line-height:1.3}
#handWrap{flex:none;padding:0 0 4px;position:relative}
#hand{position:relative;touch-action:none}
#hand .card{position:absolute;bottom:8px;cursor:pointer;transition:transform .24s cubic-bezier(.3,.7,.3,1),left .28s,filter .2s;transform:translateY(var(--ty,0)) rotate(var(--rot,0deg));transform-origin:50% 115%;touch-action:none}
#hand .card.sel{transform:translateY(-26px) rotate(0) scale(1.1)!important;z-index:60!important;box-shadow:0 0 0 2px #ffe6a0,0 0 30px rgba(255,200,80,.65),0 .6em 1.6em rgba(0,0,0,.7)}
#hand .card.peek{transform:translateY(-38px) rotate(0) scale(1.2)!important;z-index:58!important;box-shadow:0 0 0 2px #ffe6a0,0 0 26px rgba(255,200,80,.55),0 .8em 1.8em rgba(0,0,0,.75);transition:transform .12s ease-out}
.myturn #hand .card:not(.dis):not(.sel){animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 .1em var(--goldD),0 .45em 1em rgba(0,0,0,.7)}50%{box-shadow:0 0 0 .12em #ffe6a0,0 0 18px rgba(255,200,80,.55),0 .45em 1em rgba(0,0,0,.7)}}
#hcount{position:absolute;right:14px;top:-4px;font-size:10.5px;letter-spacing:.16em;font-weight:800;color:var(--mut);z-index:2}
#hcount.over{color:#ff8a7a}
#info{position:absolute;left:10px;right:10px;z-index:30;border-radius:16px;background:linear-gradient(180deg,#33261a,#1d150e);border:1.5px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 0 4px rgba(0,0,0,.35);display:none;align-items:center;gap:12px;padding:10px 12px;animation:inf .22s ease}
@keyframes inf{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#info .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:#e8dcc0}
#info .tx b{display:block;font-size:17px;color:var(--gold2);margin-bottom:1px}
#info .tx i{font-style:normal;font-size:9.5px;letter-spacing:.18em;font-weight:800;display:block;margin-bottom:2px}
#info .tx .w{color:#ff8a7a;font-weight:700;font-size:12.5px;margin-top:3px}
#info .btn{padding:13px 20px;font-size:17px;flex:none;letter-spacing:.12em}
#fx{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.gh{position:absolute;will-change:transform;transform-origin:center}
.bp{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;box-shadow:0 0 6px currentColor}
.pt-fly{position:absolute;font-weight:800;font-size:24px;pointer-events:none;text-shadow:0 0 12px rgba(255,200,80,.8),0 2px 4px #000;width:70px;text-align:center}
#fx svg.arr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#turnBanner{position:absolute;left:0;right:0;top:38%;z-index:45;display:none;justify-content:center;pointer-events:none}
#turnBanner .rb{position:relative;padding:14px 46px;background:linear-gradient(180deg,#6d1c15,#3d0e0a);border-top:2px solid var(--gold2);border-bottom:2px solid var(--goldD);box-shadow:0 12px 40px rgba(0,0,0,.7),0 0 40px rgba(255,120,60,.25)}
#turnBanner .rb:before,#turnBanner .rb:after{content:'';position:absolute;top:8px;bottom:8px;width:28px;background:#3d0e0a;z-index:-1}
#turnBanner .rb:before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
#turnBanner .rb:after{right:-20px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
#turnBanner span{font-size:28px;font-weight:800;letter-spacing:.22em;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 18px rgba(255,200,80,.5);white-space:nowrap}
#turnBanner.gold .rb{background:linear-gradient(180deg,#5a3e14,#2b1d0e)}
#turnBanner.on{display:flex;animation:tb 1.15s ease}
@keyframes tb{0%{opacity:0;transform:scaleX(.3)}14%{opacity:1;transform:scaleX(1.05)}22%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#app.shake{animation:shk .45s}

async function tryReact(src,v,single,cname){
if(FXON())await arrow(src,v,v.prot?'#7FA3C9':'#E0442F');
if(v.prot){sfx('shield');await say(T(v,`Korunuyorsun — ${cname} etkisiz`,`${v.name} korunuyor — ${cname} etkisiz`),900,'good');return true}
const opts=v.hand.filter(c=>c.name==='Fedai'||(single&&c.name==='Şövalye')).filter((c,i,a)=>a.findIndex(x=>x.name===c.name)===i);
if(isMe(v)){hurt(v);sfx('hit')}
if(!opts.length)return false;
const d=await decide(v,()=>ask(`${esc(src.name)} sana ${cname} oynadı!`,'Elindeki tepki kartıyla saldırıyı iptal edebilirsin.',[...opts.map(o=>({label:`${o.name} ile engelle`,good:1})),{label:'Engelleme'}]).then(i=>({k:'r',i})),
()=>{const pr={easy:.45,normal:.85,hard:1}[CFG.diff];let i=opts.length;if(R()<pr){const f=opts.findIndex(x=>x.name==='Fedai');i=f>=0?f:0}return{k:'r',i}});
const c=d.i<opts.length?opts[d.i]:null;
if(c){await say(T(v,`${c.name} ile engelledin!`,`${v.name} ${c.name} ile engelledi!`),200,'good');sfx('shield');await discardCards(v,[c]);await sleep(450);return true}
return false}
async function hit(src,v,single,cname,fn){if(await tryReact(src,v,single,cname))return false;if(!isMe(v))hurt(v);await fn();return true}
async function fizzle(p,why){await say(`${T(p,'Etki yok',p.name+': etki yok')}${why?' — '+why:''}`,700)}
const EFF={};
const pickIn=(p,arr,title,mode)=>chooseCards(p,arr,1,{mode:mode||'high',title}).then(r=>r[0]);
async function takeSay(p,v,cards){await say(isMe(p)?`${gen(v)} elinden ${cards.length} kart aldın`:isMe(v)?`${p.name} elinden ${cards.length} kart aldı`:`${p.name}, ${gen(v)} elinden ${cards.length} kart aldı`,0,isMe(v)?'bad':'');await moveCards(v,p,cards);await sleep(250)}
EFF['Kral']=async({p})=>{await draw(p,5);p.prot=true;sfx('good')};
EFF['Vezir']=async({p,m})=>{await draw(p,2*m);p.prot=true};
EFF['Şövalye']=async({p,m})=>{p.prot=true;await draw(p,m)};
EFF['Kalkan']=async({p,m})=>{p.prot=true;await draw(p,m)};
EFF['Tek Atış']=async({p,m})=>{await draw(p,m)};
EFF['Çifte Şans']=async({p,m})=>{await draw(p,2*m)};
EFF['Üçlü Kombo']=async({p,m})=>{await draw(p,3*m)};
EFF['Tüccar']=async({p,m})=>{await draw(p,2*m);await discardN(p,m,null,{title:'Tüccar: elinden bir kart at'})};
EFF['Fedai']=async({p})=>{await say('Fedai tepki kartıdır, kendi sırada oynanınca etkisizdir',600)};
EFF['Ödül']=async()=>{};
EFF['Prenses']=async({p})=>{let o=p.hand.filter(x=>eligibleInner(p,x,false));if(p.ai&&o.some(x=>x.name!=='Fedai'))o=o.filter(x=>x.name!=='Fedai');if(!o.length)return fizzle(p);const c=await pickIn(p,o,'Prenses: ikiye katlanacak aksiyonu seç');await playCard(p,c,2,true)};
EFF['Asker']=async({p})=>{let o=p.hand.filter(x=>eligibleInner(p,x,true));if(p.ai&&o.some(x=>x.name!=='Fedai'))o=o.filter(x=>x.name!=='Fedai');if(!o.length)return fizzle(p);const c=await pickIn(p,o,'Asker: ikiye katlanacak kartı seç');await playCard(p,c,NODOUBLE.has(c.name)?1:2,true)};
EFF['Büyü']=async({p})=>{let o=p.hand.filter(x=>eligibleInner(p,x,false));if(p.ai&&o.filter(x=>x.name!=='Fedai').length>=2)o=o.filter(x=>x.name!=='Fedai');if(!o.length)return fizzle(p);
const picks=await chooseCards(p,o,2,{mode:'high',title:'Büyü: iki aksiyonu oynama sırasıyla seç',sub:'Önce seçtiğin oynanır.'});
for(const c of picks){if(p.hand.includes(c)&&eligibleInner(p,c,false))await playCard(p,c,1,true)}};
EFF['Casus']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Casus: kimin eline bakacaksın?',{unprot:1,forced,ask:1});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Casus',async()=>{const c=await chooseCards(p,v.hand,m,{mode:'high',title:`${v.name} elinden ${m} kart al`,sub:'Elini gördün, birini seç.'});await takeSay(p,v,c)})};
EFF['Hırsız']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Hırsız: kimden çalacaksın?',{unprot:1,forced,ask:1,mode:'hand'});if(!v)return fizzle(p,'hedef yok');

EFF['Köylü']=async({p,forced})=>{const v=await choosePlayer(p,rivals(p),'Köylü: kiminle takas?',{unprot:1,forced,ask:1});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Köylü',async()=>{const [t]=await chooseCards(p,v.hand,1,{mode:'high',title:`${v.name} elinden al`});if(t)await takeSay(p,v,[t]);
const g=p.hand.filter(x=>x!==t);if(g.length){const [gv]=await chooseCards(p,g,1,{mode:'low',title:`${dat(v)} karşılık ver`});await say(T(p,`${dat(v)} 1 kart verdin`,`${p.name} ${dat(v)} 1 kart verdi`),0);await moveCards(p,v,[gv]);await sleep(250)}})};
EFF['Prens']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Prens: kimden alacaksın?',{unprot:1,forced,ask:1,mode:'hand'});if(!v)return fizzle(p,'hedef yok');

EFF['Büyücü']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Büyücü: kimin eli?',{unprot:1,forced,ask:1,mode:'hand'});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Büyücü',async()=>{const c=await chooseCards(p,v.hand,2*m,{mode:'high',title:`${v.name} elinden ${Math.min(2*m,v.hand.length)} kart seç`,sub:'Seçtiklerin desteye karışacak.'});await say(T(p,`${gen(v)} ${c.length} kartını desteye karıştırdın`,`${p.name}, ${gen(v)} ${c.length} kartını desteye karıştırdı`),0);await shuffleIn(v,c);await sleep(300);await draw(v,1)})};
EFF['Kahin']=async({p,forced})=>{const v=await choosePlayer(p,rivals(p),'Kahin: kimin elini tahmin edeceksin?',{unprot:1,forced,ask:1});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Kahin',async()=>{const name=(await decide(p,()=>pickName('Hangi kart elinde?').then(n=>({k:'n',n})),()=>{const pool=[];for(const n of NAMES)for(let i=0;i<M[n].count;i++)pool.push(n);return{k:'n',n:pool[R()*pool.length|0]}})).n;
await say(T(p,`Tahminin: ${name}`,`${p.name} tahmin etti: ${name}`),1000);
if(v.hand.some(c=>c.name===name)){const c=await chooseCards(p,v.hand,2,{mode:'high',title:`Doğru bildin! ${v.name} elinden 2 kart al`});await takeSay(p,v,c)}else await say(T(v,`Elinde ${name} yok!`,`${p.name} bilemedi: ${gen(v)} elinde ${name} yok`),900)})};
EFF['Kraliçe']=async({p})=>{const rs=rivals(p);if(isLocal(p))await reveal('Kraliçe: rakiplerin elleri',rs.map(q=>({p:q})));
const used=[];for(let k=0;k<2;k++){const cands=rs.filter(q=>!used.includes(q)&&q.hand.length);const v=await choosePlayer(p,cands,`Kraliçe: ${k+1}. rakibi seç`,{unprot:1,ask:1});if(!v)break;used.push(v);
await hit(p,v,true,'Kraliçe',async()=>{const [t]=await chooseCards(p,v.hand,1,{mode:'high',title:`${v.name} elinden al`});await takeSay(p,v,[t]);const g=p.hand.filter(x=>x!==t);if(g.length){const [gv]=await chooseCards(p,g,1,{mode:'low',title:`${dat(v)} ver`});await say(T(p,`${dat(v)} 1 kart verdin`,`${p.name} ${dat(v)} 1 kart verdi`),0);await moveCards(p,v,[gv]);await sleep(250)}})}
if(!used.length)await fizzle(p,'hedef yok')};
EFF['Engel']=async({p,forced})=>{const v=await choosePlayer(p,rivals(p),'Engel: kim kart çekemesin?',{unprot:1,forced,ask:1});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Engel',async()=>{v.noDraw=true;render();await say(T(v,'Sonraki sıranda kart çekemeyeceksin',`${v.name} sonraki sırasında kart çekemeyecek`),1000,isMe(v)?'bad':'')})};
EFF['Zehir']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Zehir: kimin karakteri atılsın?',{unprot:1,forced,ask:1,mode:'hand'});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'Zehir',async()=>{for(let i=0;i<m;i++){const ch=v.hand.filter(c=>M[c.name].type==='char');if(!ch.length){await say(T(v,'Elinde karakter yok',`${gen(v)} elinde karakter yok`),700);break}const c=ch[R()*ch.length|0];await say(`${T(v,'Elinden',gen(v)+' elinden')} ${c.name} atılıyor`,0,isMe(v)?'bad':'');await discardCards(v,[c]);await sleep(250)}})};
EFF['İhanet']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'İhanet: kimin eli yarılansın?',{unprot:1,forced,ask:1,mode:'hand'});if(!v)return fizzle(p,'hedef yok');
await hit(p,v,true,'İhanet',async()=>{const n=Math.min(v.hand.length,Math.floor(v.hand.length/2)*m);await say(T(v,`${n} kart atıyorsun`,`${v.name} ${n} kart atıyor`),600,isMe(v)?'bad':'');await discardN(v,n,null,{title:`İhanet: ${n} kart at`})})};
EFF['Şans']=async({p,forced})=>{const used=[];for(let k=0;k<2;k++){const cands=rivals(p).filter(q=>!used.includes(q)&&q.hand.length);const v=await choosePlayer(p,cands,`Şans: ${k+1}. rakibi seç`,{unprot:1,ask:1,forced:k?null:forced});if(!v)break;used.push(v);
await hit(p,v,true,'Şans',async()=>{await takeSay(p,v,[v.hand[R()*v.hand.length|0]])})}if(!used.length)await fizzle(p,'hedef yok')};
EFF['Olta']=async({p,m,forced})=>{const v=await choosePlayer(p,rivals(p),'Olta: kimin eline bakacaksın?',{forced,ask:1});if(v&&isLocal(p))await reveal('Olta: '+v.name+' eli',[{p:v}]);await draw(p,m)};
EFF['İttifak']=async({p,forced})=>{const v=await choosePlayer(p,rivals(p),'İttifak: kiminle korunacaksın?',{forced,ask:1});p.prot=true;if(v){v.prot=true;render();sfx('shield');await say(isMe(p)?`Sen ve ${v.name} bir tur korunuyorsunuz`:isMe(v)?`${p.name} ve sen bir tur korunuyorsunuz`:`${p.name} ve ${v.name} bir tur korunuyor`,900,'good')}};
EFF['Ateşkes']=async({p})=>{G.ceasefire=p;await say(`Ateşkes! ${T(p,'Senin sıran',gen(p)+' sırası')} gelene kadar saldırı yok`,900,'good');await draw(p,1)};
EFF['Hazine']=async({p,m})=>{await draw(p,2*m);for(const q of rivals(p))await draw(q,m)};
EFF['Bolluk']=async({p,m})=>{await draw(p,3*m);for(const q of rivals(p))await draw(q,m)};
EFF['İsyan']=async({p,m})=>{const mn=Math.min(...G.players.map(q=>q.hand.length));for(const q of G.players)if(q.hand.length===mn){await say(T(q,'En az kart sende: 2 kart çekiyorsun',`${q.name} en az kartlı: 2 kart çekiyor`),300);await draw(q,2*m)}};
EFF['Kana Susamış']=async({p,m})=>{await discardN(p,m,null,{title:'Kana Susamış: sen de 1 kart at'});for(const q of rivals(p))await hit(p,q,false,'Kana Susamış',()=>discardN(q,m,null,{title:'Kana Susamış: 1 kart at'}))};
EFF['Deprem']=async({p,m})=>{await discardN(p,2*m,null,{title:'Deprem: 2 kart at'});for(const q of rivals(p))await hit(p,q,false,'Deprem',()=>discardN(q,2*m,null,{title:'Deprem: 2 kart at'}))};
EFF['Salgın']=async({p,m})=>{await discardN(p,m,null,{title:'Salgın: 1 kart at'});await draw(p,m);for(const q of rivals(p))await hit(p,q,false,'Salgın',async()=>{await discardN(q,m,null,{title:'Salgın: 1 kart at'});await draw(q,m)})};
EFF['Savaş']=async({p,m})=>{for(const q of rivals(p))await hit(p,q,false,'Savaş',async()=>{for(let i=0;i<m;i++){const ch=q.hand.filter(c=>M[c.name].type==='char');if(!ch.length)break;ch.sort((a,b)=>pts(a)-pts(b));await say(T(q,`En düşük karakterini atıyorsun: ${ch[0].name}`,`${q.name} en düşük karakterini atıyor: ${ch[0].name}`),0,isMe(q)?'bad':'');await discardCards(q,[ch[0]]);await sleep(200)}})};
EFF['Kıtlık']=async({p,m})=>{const n=G.players.length,i0=idxOf(p);const left=[];for(let k=1;k<n&&left.length<3;k++)left.push(G.players[(i0+k)%n]);for(const q of left)await hit(p,q,false,'Kıtlık',()=>discardN(q,m,null,{title:'Kıtlık: 1 kart at'}))};
EFF['Kaos']=async({p})=>{const pool=[],ps=[];for(const q of rivals(p)){if(q.prot||!q.hand.length)continue;if(await tryReact(p,q,false,'Kaos'))continue;ps.push([q,q.hand.length]);pool.push(...q.hand);q.hand=[]}
shuffle(pool);for(const [q,n] of ps){q.hand=pool.splice(0,n);q.hand.forEach(c=>c.blocked=false)}render();shake();await say('Rakiplerin elleri karıştırıldı',1000)};
EFF['İntikam']=async({p,forced})=>{const cands=rivals(p).filter(q=>q.last&&!['Ödül','Fedai','İntikam','Büyü','Asker','Prenses'].includes(q.last.name));const v=await choosePlayer(p,cands,'İntikam: kimin son kartı?',{forced,ask:1});if(!v)return fizzle(p);
const n=v.last.name;await say(T(p,`${gen(v)} son kartını (${n}) ona karşı kullanıyorsun`,isMe(v)?`${p.name}, son kartını (${n}) sana karşı kullanıyor`:`${p.name}, ${gen(v)} son kartını (${n}) ona karşı kullanıyor`),1100);await EFF[n]({p,m:1,forced:v})};
async function playCard(p,c,m=1,inner=false){
const src=anchorOf(p,c);
rm(p.hand,c);c.blocked=false;STATS.played[c.name]=(STATS.played[c.name]||0)+1;
const mt=M[c.name];
if(FXON())render();
say(`${T(p,c.name+' oynuyorsun',p.name+' '+c.name+' oynuyor')}${inner?' · etki ×'+m:''}`,0,ATK.has(c.name)&&!isMe(p)?'bad':'');
sfx('play');
if(FXON()){
const sr=rectOf($('#stageCard'));
await fly(c,isMe(p),src,sr,{dur:560,arc:-60});
if(!isMe(p))await flipAt(c,sr);
renderStage(p,c);burst(sr.x,sr.y,COL[mt.cat],ATK.has(c.name)?24:16);
await sleep(isMe(p)?600:900)}
try{await EFF[c.name]({p,m,card:c,forced:null})}catch(e){if(!(e&&e.message==='abort'))STATS.errors.push(c.name+': '+(e&&e.stack||e));throw e}
if(mt.type==='char'){
p.saray.push(c);
if(FXON()){G.hide.add(c.id);render();const sr=rectOf($('#stageCard'));renderStage(null,null);const to=sarayAnchor(p,c);
await fly(c,true,sr,to,{dur:620,fade:!isMe(p),arc:-40});G.hide.delete(c.id);render();
burst(to.x,to.y,'#F3DC8C',14);floatText(to.x,to.y-12,'+'+mt.pts);sfx('coin');
if(isMe(p)){const sc=$('#myScore');sc.classList.remove('pulse');void sc.offsetWidth;sc.classList.add('pulse');await say(`${c.name} Sarayına girdi · +${mt.pts}`,650,'good')}else await sleep(300)}
}else{
p.played.push(c);
if(FXON()){const sr=rectOf($('#stageCard'));renderStage(null,null);const to=rectOf($('#disc .pc2'));G.hide.add(c.id);G.top=c;render();
await fly(c,true,sr,to,{dur:480,rot:8});G.hide.delete(c.id);render()}
else G.top=c}
p.last=c;render();await sleep(250)}
function aiScore(p,c){const m=M[c.name];const noise={easy:3.5,normal:1.3,hard:.5}[CFG.diff];
const tg=rivals(p).filter(q=>!q.prot);let s;
if(m.type==='char'){s=m.pts+1+({Kral:3,Vezir:2,Kraliçe:1.5,Prens:1.5,Casus:1,Hırsız:1,Tüccar:.3,Büyücü:1,Kahin:.8,Prenses:1,Asker:1}[c.name]||0);
if(c.name==='Şövalye'&&p.hand.filter(x=>x.name==='Fedai'||x.name==='Şövalye').length<2)s-=2.2;
if(c.name==='Kral'&&p.hand.length>=5)s-=1.5}
else{s=({'Tek Atış':2.2,'Çifte Şans':3,'Üçlü Kombo':3.6,'Bolluk':3.4,'Hazine':3,'Kalkan':2.4,'Ateşkes':2,'İttifak':1.2,'İsyan':1.5,'Salgın':1.4,'Olta':1.4,'Şans':2.8,'Zehir':3,'İhanet':3.2,'Savaş':2.6,'Engel':1.8,'Kana Susamış':1.2,'Deprem':1.2,'Kıtlık':2.2,'Kaos':1.4,'Büyü':3.2,'İntikam':1.5,'Fedai':-6})[c.name]??1}
if(M[c.name].atk&&!tg.length)s-=5;
if(['Tek Atış','Çifte Şans','Üçlü Kombo','Bolluk','Hazine'].includes(c.name)&&p.hand.length>=6)s-=2;
return s+R()*noise}
function aiPick(p){const cs=p.hand.filter(c=>canPlay(p,c));if(!cs.length)return null;const sc=cs.map(c=>[c,aiScore(p,c)]);sc.sort((a,b)=>b[1]-a[1]);return sc[0][0]}
function waitPlay(p){return new Promise(res=>{G.waitRes=res;const any=p.hand.some(c=>canPlay(p,c));
if(!any){narrHTML('Oynanabilir kartın yok<small>Sıra geçiyor</small>');setTimeout(()=>{if(G.waitRes===res){G.waitRes=null;res(null)}},CFG.fast?0:1400)}
else narrHTML(G.tutor?'Bir karta dokun, sonra OYNA<small>Parmağını kartların üzerinde kaydırarak hepsini görebilirsin</small>':'Bir kart seç')})}
async function turn(p,final){
G.cur=p;G.sel=null;p.prot=false;if(G.ceasefire===p)G.ceasefire=null;STATS.turns++;
const isH=isLocal(p);
G.log.push({msg:`— ${p.name} sırası${final?' (son tur)':''} —`});render();
if(isH){sfx('turn');try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}await banner(final?'SON HAMLEN':'SIRA SENDE')}
else await sleep(300);
if(!final){
if(G.firstTurn){G.firstTurn=false;await say(T(p,'Sen başlıyorsun · ilk sırada kart çekilmez',`${p.name} başlıyor · ilk sırada kart çekilmez`),1000)}
else if(p.noDraw){p.noDraw=false;render();await say(T(p,'Zincirlisin — bu sıra kart çekemezsin',`${p.name} zincirli — bu sıra kart çekemez`),1000,isH?'bad':'')}
else{await draw(p,1);await sleep(200)}
}else{if(p.noDraw)p.noDraw=false;await say(isH?'Son tur — kart çekmeden bir kart oyna':`${p.name} son hamlesini yapıyor`,isH?800:400)}
render();
let c=null;
if(p.hand.length){
const any=p.hand.some(x=>canPlay(p,x));
if(!any){G.humanTurn=false;await say(T(p,'Oynanabilir kartın yok — sıra geçiyor',`${p.name}: oynanabilir kart yok`),1000)}
else{
if(p.ai){G.thinking=p;renderOpps();await sleep(CFG.diff==='hard'?650:500);G.thinking=null;renderOpps()}
const d=await decide(p,async()=>{G.humanTurn=true;render();const x=await waitPlay(p);G.humanTurn=false;G.tutor=false;render();return{k:'play',id:x?x.id:null}},()=>{const x=aiPick(p);return{k:'play',id:x?x.id:null}});
G.humanTurn=false;c=d.id==null?null:p.hand.find(x=>x.id===d.id)||null}
}else await say(T(p,'Elin boş — sıra geçiyor',`${p.name}: eli boş`),800);
G.humanTurn=false;
if(c)await playCard(p,c,1);
if(p.hand.length>7){const n=p.hand.length-7;
await say(isH?'El sınırı 7 — fazlasını at':`${p.name} el sınırı için ${n} kart atıyor`,0,isH?'bad':'');
const d=await chooseCards(p,p.hand.slice(),n,{mode:'low',title:'Elinde en fazla 7 kart kalabilir',sub:`${n} kart seç ve at.`});await discardCards(p,d)}
render();await sleep(200)}
async function run(){
try{

function showPanel(id){['pMain','pSolo','pOnline','pLobby','pGate'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function showLobby(){if(G)return;const _r=NET.room||{};const _k=JSON.stringify([NET.code,NET.players,_r.ai,_r.diff]);if(showLobby.k===_k&&!$('#pLobby').classList.contains('hidden')&&!$('#setup').classList.contains('hidden'))return;showLobby.k=_k;$('#setup').classList.remove('hidden');$('#game').classList.add('hidden');showPanel('pLobby');
$('#lbCode').textContent=NET.code;const host=NET.seat===0;const r=NET.room||{ai:0,diff:'normal'};
$('#lbPlayers').innerHTML=NET.players.map((p,i)=>`<div>${houseShield(i,p.seat===NET.seat,p.name)}${esc(p.name)}${p.seat===NET.seat?' (sen)':''}${p.seat===0?'<small>KURUCU</small>':''}</div>`).join('')+(r.ai?Array.from({length:r.ai},(_,i)=>`<div style="opacity:.7">${houseShield(NET.players.length+i,false,'Y')}Yapay zekâ<small>YZ</small></div>`).join(''):'');
$('#lbHost').classList.toggle('hidden',!host);$('#lbWait').classList.toggle('hidden',host);
const maxAi=Math.max(0,6-NET.players.length);
const sa=$('#segAi');sa.innerHTML='';for(let i=0;i<=Math.min(4,maxAi);i++){const b=document.createElement('button');b.textContent=i;if(r.ai===i)b.className='on';b.onclick=()=>NET_set({ai:i});sa.appendChild(b)}
const sd=$('#segDiff2');sd.innerHTML='';[['easy','Kolay'],['normal','Normal'],['hard','Zor']].forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;if(r.diff===k)b.className='on';b.onclick=()=>NET_set({diff:k});sd.appendChild(b)});
$('#lbStart').disabled=NET.players.length+(r.ai||0)<2}
async function NET_set(o){try{await api('settings',{code:NET.code,token:NET.token,...o});await NET.sync()}catch(e){$('#lbErr').textContent=e.message}}
async function enterRoom(code,seat,token){NET.code=code;NET.seat=seat;NET.token=token;NET.round=null;NET.reset();NET.on=false;NET.seatMap=null;LS.set('ts_room',JSON.stringify({code,seat,token}));
NET.connect();await NET.sync();if(!LS.get('ts_intro')&&!G){LS.set('ts_intro','1');showIntro(()=>{})}}
function leaveRoom(){NET.code=null;NET.on=false;NET.room=null;LS.set('ts_room','');try{NET.sub&&NET.sub.close&&NET.sub.close()}catch(e){}NET.sub=null;MY.round=-1;MY.l=[];}
(function init(){
const seg=(id,items,get,set)=>{const el=$(id);items.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;if(get()===k)b.className='on';b.onclick=()=>{set(k);sfx('tap');el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};el.appendChild(b)})};
seg('#segOpp',[1,2,3,4,5].map(i=>[i,String(i)]),()=>CFG.opps,v=>CFG.opps=v);
seg('#segDiff',[['easy','Kolay'],['normal','Normal'],['hard','Zor']],()=>CFG.diff,v=>CFG.diff=v);
$('#crestSvg').innerHTML=crest();$('#logoSvg').innerHTML=crest();
$('#fan').innerHTML=['Şövalye','Büyücü','Kral','Kraliçe','Fedai'].map((n,i)=>`<div style="transform:rotate(${(i-2)*9}deg) translateY(${Math.abs(i-2)*7}px);z-index:${i===2?5:1}">${cardHTML({id:n,name:n},{w:i===2?78:68})}</div>`).join('');
$('#btnFast').innerHTML=UI.fast;$('#btnSnd').innerHTML=UI.snd;$('#btnRules').innerHTML=UI.help;$('#btnQuit').innerHTML=UI.x;
const go=()=>{NET.on=false;CFG.fast=false;RNG=Math.random;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}sfx('turn');if(!LS.get('ts_intro')){LS.set('ts_intro','1');showIntro(()=>startGame({}))}else startGame({})};
$('#startBtn').onclick=go;
$('#soloBtn').onclick=()=>{sfx('tap');showPanel('pSolo')};
document.querySelectorAll('.back1').forEach(b=>b.onclick=()=>showPanel('pMain'));
$('#onlineBtn').onclick=()=>{sfx('tap');$('#inName').value=LS.get('ts_name')||'';showPanel('pOnline')};
const nameOk=()=>{const n=$('#inName').value.trim();if(!n){$('#onErr').textContent='Önce adını yaz';return null}LS.set('ts_name',n);return n};
$('#createBtn').onclick=async()=>{const n=nameOk();if(!n)return;$('#onErr').textContent='';try{const r=await api('create',{name:n});await enterRoom(r.code,r.seat,r.token)}catch(e){$('#onErr').textContent=e.message}};
$('#joinBtn').onclick=async()=>{const n=nameOk();if(!n)return;const c=$('#inCode').value.trim();if(!c){$('#onErr').textContent='Davet linkiyle gir';return}$('#onErr').textContent='';try{const r=await api('join',{code:c,name:n});await enterRoom(r.code,r.seat,r.token)}catch(e){$('#onErr').textContent=e.message}};
$('#shareBtn').onclick=async()=>{const url=location.origin+location.pathname+'?oda='+NET.code;const txt='Taht Savaşı\'na davetlisin! Bu linkten gir:';try{if(navigator.share){await navigator.share({title:'Taht Savaşı',text:txt,url});return}}catch(e){return}try{await navigator.clipboard.writeText(txt+' '+url);toast('Link kopyalandı')}catch(e){toast(url)}};
$('#lbStart').onclick=async()=>{try{$('#lbStart').disabled=true;await api('start',{code:NET.code,token:NET.token});await NET.sync()}catch(e){$('#lbErr').textContent=e.message;$('#lbStart').disabled=false}};
$('#lbLeave').onclick=()=>{leaveRoom();showPanel(OWNER?'pMain':'pGate')};
$('#takeBtn').onclick=async()=>{const p=G&&G.thinking;if(!p)return;const i=idxOf(p);const seat=Object.keys(NET.seatMap||{}).find(k=>NET.seatMap[k]===i);NET.hideTake();try{await api('move',{code:NET.code,token:NET.token,n:p.ni||0,forSeat:+seat,data:{k:'ai'}});await NET.sync()}catch(e){toast(e.message)}};
(async()=>{const qs=new URLSearchParams(location.search).get('oda');let sv=null;try{sv=JSON.parse(LS.get('ts_room')||'null')}catch(e){}
const gate=t=>{if(t)$('#gateTxt').textContent=t;showPanel('pGate')};
if(!OWNER){showPanel('pGate')}
const code=qs?qs.trim():(sv&&sv.code);
if(code){try{if(sv&&sv.code===code){const r=await api('join',{code,name:LS.get('ts_name')||'Oyuncu'});await enterRoom(r.code,r.seat,r.token);return}
const room=await fb('GET','/rooms/'+code);if(!room||!room.info)throw E('Bu davet artık geçerli değil.',404);
if(room.info.status!=='lobby'||Date.now()-(room.info.t||0)>12*36e5)throw E('Bu davetin süresi dolmuş. Yeni oyun için davet linkini iste.',409);
$('#inName').value=LS.get('ts_name')||'';$('#inCode').value=code;$('#createBtn').textContent='ODAYA KATIL';$('#createBtn').onclick=()=>$('#joinBtn').click();$('#pOnline .back1').style.display='none';showPanel('pOnline')}
catch(e){LS.set('ts_room','');if(!OWNER)gate(e.message||'Bu davet artık geçerli değil.');else showPanel('pMain')}}
try{if(qs&&!OWNER)history.replaceState(null,'',location.pathname)}catch(e){}})();
$('#setupRules').onclick=()=>showIntro(()=>{});$('#btnRules').onclick=openRules;
$('#btnSnd').onclick=()=>{CFG.sound=!CFG.sound;$('#btnSnd').innerHTML=CFG.sound?UI.snd:UI.mute;$('#btnSnd').classList.toggle('on',CFG.sound)};
$('#btnFast').onclick=()=>{CFG.speed=CFG.speed<.6?.8:.42;$('#btnFast').classList.toggle('on',CFG.speed<.6)};
$('#btnQuit').onclick=async()=>{if(NET.on){const i=await ask('Odadan çıkılsın mı?','Oyun arkadaşların için sürer. Kurucu, senin yerine yapay zekâyı oynatabilir. Aynı telefondan tekrar girersen kaldığın yerden devam edersin.',[{label:'Devam et',good:1},{label:'Odadan çık'}]);if(i===1){leaveRoom();showSetup()}return}
const i=await ask('Savaştan çekilsin mi?','Bu oyun kaybolur.',[{label:'Devam et',good:1},{label:'Ana menüye dön'}]);if(i===1)showSetup()};
(()=>{const e=$('#ember');for(let i=0;i<18;i++){const d=document.createElement('i');d.style.cssText=`left:${Math.random()*100}%;--dx:${(Math.random()*80-40)}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;e.appendChild(d)}})();
window.addEventListener('resize',()=>{if(G)render()});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>{if(!/INPUT|TEXTAREA/.test((e.target||{}).tagName))e.preventDefault()},{passive:false}));
let _lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-_lt<350&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName))e.preventDefault();_lt=n},{passive:false});
window.__game={startGame,STATS,CFG,NET,get G(){return G}};
})();
</script>
</body>
</html>
